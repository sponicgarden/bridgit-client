<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devices map</title>
<!-- Devices tab, Map view (owner, 4 Nov 2026): the Home scene's look for the devices around this phone.
     The phone is the hexagon; its devices sit round it in group bubbles (Computers, Routers & switches, Cameras, Audio…).
     Tap a bubble for that group's devices. Brand logos come from assets/device-brands.
     Fed by DevicesScene.kt; no network, the icon font is the Home scene's bundled subset. -->
<script>
document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";
</script>
<style>
@font-face { font-family: "Material Symbols Outlined"; font-style: normal; font-weight: 300; font-display: block; src: url(symbols.woff2) format("woff2"); }
:root {
  color-scheme: dark;
  --void: #24212A; --panel: #302B38; --line: #484051; --dim: #BDB3C9; --ink: #F0EBF5; --muted: #BDB3C9;
  --core: #C4AED8; --lock: #f2b544; --off: #484051; --offink: #BDB3C9; --ok: #4fe0a0;
  --senses: #5cc8ff; --aware: #4fe0a0; --controls: #b48cff; --you: #ff9a52; --intel: #f2b544;
  --display: system-ui, -apple-system, sans-serif;
  --body: system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --void: #FDFCFE; --panel: #F1EEF6; --line: #E2DCE9; --dim: #675D71; --ink: #332C3D; --muted: #675D71;
  --core: #6D587E; --lock: #805600; --off: #E2DCE9; --offink: #675D71; --ok: #006c46;
  --senses: #00688e; --aware: #006c46; --controls: #6940aa; --you: #994800; --intel: #805600;
}
html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); overflow-x: clip; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--body); font-size: 15px; display: flex; flex-direction: column; overflow-y: auto; }
body > * { flex: 0 0 auto; }
.hdrline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 16px; font: 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; }
#hdr { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#hdr.pulse { color: var(--core); animation: hdrPulse 1.4s ease-in-out infinite; }
@keyframes hdrPulse { 50% { opacity: .35; } }
.hbtn { font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--core); background: none; border: 1px solid var(--core);
  border-radius: 8px; padding: 0 12px; min-height: 36px; cursor: pointer; }
.hbtn:active { opacity: .6; }
#stage { flex: 1 1 0; min-height: 420px; display: flex; justify-content: center; }
svg#scene { width: 100%; height: 100%; display: block; background: var(--void); }
#scene .ms { font-family: "Material Symbols Outlined"; font-size: 17px; text-anchor: middle; dominant-baseline: central; fill: var(--muted); pointer-events: none; }
#scene pattern circle { fill: var(--line); }
#ring { stroke: var(--line); }
#core > polygon:first-child { fill: var(--panel); stroke: var(--core); }
#core > polygon { stroke: var(--core); }
#bridge svg > g { fill: var(--ink); }
.wordmark { font-family: var(--display); font-weight: 700; font-size: 15px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
.coresub { font-family: var(--mono); font-size: 7px; fill: var(--muted); text-anchor: middle; letter-spacing: .1em; text-transform: uppercase; }

.node { opacity: 0; cursor: pointer; }
.node .hit { fill: transparent; }
.node .ring { fill: var(--panel); stroke: var(--c); stroke-width: 1.1; stroke-dasharray: 2 3; }
.node .nlabel { font-family: var(--body); font-weight: 500; font-size: 9.6px; fill: var(--ink); pointer-events: none; }
.node .nsub { font-family: var(--mono); font-size: 7.4px; fill: var(--muted); pointer-events: none; }
/* Added and reachable: solid ring tinted in its group colour. Seen on the network: solid but quieter.
   Offline: faded and dashed. Added but not checked yet: amber dashed, like "Needs access" on Home. */
.node.on .ring { fill: color-mix(in srgb, var(--c) 22%, var(--panel)); stroke-dasharray: none; stroke-width: 1.6; }
.node.on .ms { fill: var(--c); }
.node.on .nlabel { font-weight: 600; }
.node.seen .ring { fill: var(--panel); stroke-dasharray: none; stroke-width: 1.1; }
.node.seen .ms { fill: var(--c); }
.node.off > .ring, .node.off > .ms, .node.off > .nlabel { opacity: .5; }
.node.off .ring { stroke: var(--off); fill: var(--void); }
.node.off .ms { fill: var(--off); }
.node.off .nlabel { fill: var(--offink); font-weight: 400; }
.node.blocked .ring { stroke: var(--lock); stroke-dasharray: 2 3; fill: var(--void); }
.node.blocked .ms { fill: var(--lock); }
.node.blocked .nlabel { fill: var(--lock); }
.node.more .ring { stroke: var(--muted); fill: none; stroke-dasharray: 3 3; }
.node.more .ms { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.node.flash .ring { stroke: #fff; stroke-width: 2; }
/* Added to Bridgit: green ring and a slow pulse, like the connected agent on Home. */
.node.linked .ring { stroke: var(--ok); stroke-width: 2; fill: color-mix(in srgb, var(--ok) 20%, var(--panel)); stroke-dasharray: none; }
.node.linked .ms { fill: var(--ok); }
.node.linked .nlabel { fill: var(--ok); font-weight: 700; }
.node .lhalo { fill: none; stroke: var(--ok); stroke-width: 1.5; opacity: 0; pointer-events: none; }
.node.linked .lhalo { animation: connectionPulse 2.4s ease-in-out infinite; }
@keyframes connectionPulse { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
.trace.linked { stroke: var(--ok); opacity: .7; }
.live .trace.linked { stroke-dasharray: 2 6; animation: flow 2.4s linear infinite; }
.node .halo { fill: none; stroke: var(--c); stroke-width: 1; opacity: 0; pointer-events: none; }
.node.busy .halo { opacity: .6; animation: listen 1.6s ease-in-out infinite; }
@keyframes listen { 50% { opacity: .12; } }

.trace { stroke: var(--c); stroke-width: 1; opacity: 0; fill: none; }
.trace.on { opacity: .55; }
.trace.seen { opacity: .3; stroke-dasharray: 1 4; }
.trace.off, .trace.more { stroke: var(--off); stroke-dasharray: 2 3; opacity: .7; }
.trace.blocked { stroke: var(--lock); stroke-dasharray: 2 3; opacity: .6; }
.live .trace.on { stroke-dasharray: 2 6; animation: flow 2.4s linear infinite; }
.live #core > polygon:first-child { animation: breathe 4s ease-in-out infinite; }
@keyframes flow { to { stroke-dashoffset: 16; } }
@keyframes breathe { 50% { stroke-opacity: .55; } }
.scanline { stroke: var(--core); stroke-width: 1; opacity: .8; }

#empty { font-family: var(--body); font-size: 11px; fill: var(--muted); text-anchor: middle; }
#empty .t1 { font-family: var(--display); font-weight: 600; font-size: 15px; fill: var(--ink); }

.legendrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 2px 16px 14px; font: 11.5px/1.4 var(--mono); color: var(--muted); }
.legendrow i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legendrow .k-on { background: color-mix(in srgb, var(--core) 30%, var(--panel)); border: 1.6px solid var(--core); }
.legendrow .k-seen { border: 1.2px solid var(--muted); }
.legendrow .k-off { border: 1.2px dashed var(--off); }
.legendrow .k-need { border: 1.2px dashed var(--lock); }
.legendrow [hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  .live .trace.on, .live .trace.linked, .live #core > polygon:first-child, .node.busy .halo, .node.linked .lhalo, #hdr.pulse { animation: none; }
}
/* Group bubbles (owner, 4 Nov 2026): one per group, a dot per device round it, the count in a badge. */
.pod { opacity: 0; cursor: pointer; transition: opacity .3s; }
.pod .hit { fill: transparent; }
.pod .pring { fill: color-mix(in srgb, var(--c) 16%, var(--panel)); stroke: var(--c); stroke-width: 1.5; }
#scene .pod .pic { font-size: 20px; fill: var(--c); }
.pod .pbadge circle { fill: var(--c); stroke: var(--void); stroke-width: 1.5; }
.pod .pbadge text { font: 600 8.5px var(--mono); fill: var(--void); text-anchor: middle; dominant-baseline: central; }
.pod .nlabel { font-family: var(--body); font-weight: 600; font-size: 10.4px; fill: var(--ink); pointer-events: none; }
.pod .nsub { font-family: var(--mono); font-size: 7.6px; fill: var(--muted); pointer-events: none; }
.pod.empty .pring { fill: var(--void); stroke: var(--off); stroke-dasharray: 2 3; }
#scene .pod.empty .pic { fill: var(--off); }
.pod.empty .pbadge circle { fill: var(--off); }
.pod.empty .nlabel { fill: var(--offink); font-weight: 500; }
.pod.flash .pring { stroke: #fff; stroke-width: 2.4; }
.pod.active .pring { stroke-width: 2.6; fill: color-mix(in srgb, var(--c) 32%, var(--panel)); }
.pod.active .halo { opacity: .7; }
.pod .halo { fill: none; stroke: var(--c); stroke-width: 1; opacity: 0; transition: opacity .3s; }
.pod.dim { opacity: .3 !important; }
.pod.busy .halo { opacity: .6; animation: listen 1.6s ease-in-out infinite; }
.sat { stroke: none; }
.sat.s-linked { fill: var(--ok); }
.sat.s-on, .sat.s-seen { fill: var(--c); }
.sat.s-off { fill: none; stroke: var(--off); stroke-width: .9; }
.sat.s-blocked { fill: var(--lock); }
.zoomed #pods, .zoomed .ptrace { opacity: 0; pointer-events: none; }
#pods, .ptrace { transition: opacity .3s; }
/* A touch must not leave the WebView's focus box on a bubble; keyboard focus still shows as a bolder ring. */
#scene :focus { outline: none; }
#scene .pod:focus-visible .pring, #scene .node:focus-visible .ring { stroke-width: 2.8; }
/* Brand logos: drawn as a plain silhouette in the theme's ink, whatever their own colours. */
#scene image.logo { filter: brightness(0) invert(1); opacity: .92; pointer-events: none; }
:root[data-theme="light"] #scene image.logo { filter: brightness(0); opacity: .8; }
.node.off image.logo { opacity: .4; }
#flash { opacity: 0; pointer-events: none; }
#flash.show { animation: flashIn 1.3s ease-out forwards; }
#flash.hold { opacity: 1; transition: opacity .2s; }
#flash text { text-anchor: middle; }
#flashT1 { font-family: var(--display); font-weight: 600; font-size: 13px; fill: var(--ink); }
#flashT2 { font-family: var(--mono); font-size: 8.5px; fill: var(--muted); }
@keyframes flashIn { 0% { opacity: 0; transform: translateY(5px); } 12% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }
/* Tabs (owner, 4 Nov 2026), like the List view's tiles: Devices, Online and Offline filter the map; Groups is the
   overview, and while a group is open it names that group and takes you back. */
.tabsline { display: flex; align-items: stretch; gap: 8px; padding: 8px 12px 0; }
.tabs { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; background: var(--panel); border-radius: 12px; padding: 4px; }
.tab { flex: 1 1 0; min-width: 0; position: relative; background: none; border: 0; border-radius: 9px; padding: 5px 7px 9px; text-align: left;
  color: var(--muted); font-family: var(--body); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tab b { display: block; font: 700 19px/1.2 var(--body); color: var(--ink); }
.tab span { display: block; font-size: 10.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[data-tab="online"] b { color: var(--ok); }
.tab[data-tab="offline"] b { color: var(--muted); }
.tab.on { background: color-mix(in srgb, var(--ink) 9%, var(--panel)); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--core); }
.tab.zoom { flex-grow: 1.8; background: color-mix(in srgb, var(--core) 20%, var(--panel)); }
.tab.zoom::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--core); }
.tab.zoom span { color: var(--core); font-weight: 600; }
.tab:disabled { cursor: default; }
.tab:active:not(:disabled) { opacity: .7; }
.hbtn.run { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 58px; padding: 0 10px;
  border-radius: 12px; font: 700 18px/1 var(--body); letter-spacing: 0; }
.hbtn.run svg { width: 19px; height: 19px; fill: currentColor; }
.hbtn.run:disabled { opacity: .45; }
.hdrline { min-height: 18px; padding: 5px 16px 0; }
@media (prefers-reduced-motion: reduce) { #flash.show { animation: none; opacity: 1; } .pod.busy .halo { animation: none; } }
</style>

<script>
(function () {
  "use strict";
  // Groups map (owner, 4 Nov 2026): the overview shows one bubble per group (Computers, Routers & switches,
  // Cameras, Audio, …) with a dot per device. Tap a bubble to see its devices round the phone.
  // Network Diagnostics: each device found flies from the phone into its group, its brand logo flashing as it lands;
  // when the scan ends, the map walks the groups one by one.
  var NS = "http://www.w3.org/2000/svg";
  var CX = 180, CY = 320, RX = 124, RY = 200, R = 17, PR = 22, PRX = 120, PRY = 192, GROUP_CAP = 15, SAT_CAP = 16;
  var A = window.BridgitDevicesApp || { ready: function () {}, open: function () {}, view: function () {} };
  if (!A.view) A.view = function () {};
  var svg = document.getElementById("scene"), gNodes = document.getElementById("nodes"), gTraces = document.getElementById("traces");
  var gPods = document.getElementById("pods"), gPk = document.getElementById("packets"), gPing = document.getElementById("pings");
  var core = document.getElementById("core"), hdr = document.getElementById("hdr"), empty = document.getElementById("empty");
  var findBtn = document.getElementById("find");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var flash = document.getElementById("flash"), flashLogos = document.getElementById("flashLogos");
  var flashT1 = document.getElementById("flashT1"), flashT2 = document.getElementById("flashT2");
  // Every icon must be in symbols.woff2 (the Home subset), or its name shows as text.
  var ICON = { camera: "videocam", tv: "screenshot_monitor", cast: "screenshot_monitor", speaker: "volume_up", audio: "volume_up",
    router: "lan", smart: "tune", computer: "screenshot_monitor", mobile: "touch_app", printer: "lan", unknown: "lan" };
  var GICON = { COMPUTERS: "screenshot_monitor", NETWORK: "lan", CAMERAS: "videocam", AUDIO: "volume_up", MEDIA: "screenshot_monitor",
    PRINTERS: "lan", SMART: "tune", MOBILE: "touch_app", OTHER: "lan" };
  var GCOLOR = { COMPUTERS: "var(--core)", NETWORK: "var(--ink)", CAMERAS: "var(--senses)", AUDIO: "var(--controls)", MEDIA: "var(--you)",
    PRINTERS: "var(--muted)", SMART: "var(--aware)", MOBILE: "var(--muted)", OTHER: "var(--muted)" };
  // Always on the map, even when empty, so "no switches found" is something you can see.
  var CORE_GROUPS = ["COMPUTERS", "NETWORK", "CAMERAS", "AUDIO"];
  var FALLBACK_GROUPS = [{ id: "COMPUTERS", title: "Computers" }, { id: "NETWORK", title: "Routers & switches" }, { id: "CAMERAS", title: "Cameras" },
    { id: "AUDIO", title: "Audio" }, { id: "MEDIA", title: "TV & video" }, { id: "PRINTERS", title: "Printers" }, { id: "SMART", title: "Smart home" },
    { id: "MOBILE", title: "Phones & tablets" }, { id: "OTHER", title: "Other devices" }];

  var nodes = {}, pods = {}, run = 0, mode = "idle", queued = null, sweep = null, data = null, view = "";
  var landed = null, arrivals = [], waiting = {}, pumping = false, finalData = null, skipWalk = false;
  // When a group opens or closes, its first device sits where the finger is: ignore taps for a moment so one tap
  // does not open the group and then the device under it.
  var switchedAt = 0;
  // Which devices the map shows: "all", "online" or "offline" (the tabs).
  var filter = "all";
  function passes(d) { return filter === "all" || (filter === "online") === online(d); }
  function settling() { return performance.now() - switchedAt < 500; }

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function still() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, still() ? 0 : ms); }); }
  function short(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function gcolor(id) { return GCOLOR[id] || GCOLOR.OTHER; }
  function showEmpty(on) { empty.setAttribute("display", on ? "inline" : "none"); }
  function groupList(o) { return (o && o.groups && o.groups.length) ? o.groups : FALLBACK_GROUPS; }
  function groupOf(d) { return d.group || "OTHER"; }
  function online(d) { return d.state === "on" || d.state === "seen"; }

  // The groups to draw, in order, each with its devices. [only] limits devices to those that have landed.
  function stats(o, only) {
    var by = {}, order = groupList(o);

    ((o && o.devices) || []).forEach(function (d) {

  }
  function groupById(o, id) { return stats(o).filter(function (g) { return g.id === id; })[0]; }

  function ringSlots(count, rx, ry) {

    }
    return order;
  }

    n.g.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")" + (s !== 1 ? " scale(" + s.toFixed(3) + ")" : ""));

      fly(p.x, p.y, p.color, 300);
      var logos = [], seenLogo = {};
      grp.devs.forEach(function (d) { if (d.logo && !seenLogo[d.logo]) { seenLogo[d.logo] = 1; logos.push(d.logo); } });
      var up = grp.devs.filter(online).length;
      showFlash(logos, grp.title + " · " + grp.devs.length, up + " online" + (grp.devs.length > up ? " · " + (grp.devs.length - up) + " offline" : ""), true);
      hdr.textContent = grp.title + " · " + grp.devs.length + " found";
      await wait(1150); if (my !== run) return;
    }
    Object.keys(pods).forEach(function (id) { pods[id].g.classList.remove("dim", "active"); });
    hideFlash();
  }

  // One request between the phone and a device: out along the line, a ping at the device (or its group), a reply back.
  function packet(n, ok, d) {
    if (still() || !n) return;
    var color = ok === false ? "var(--lock)" : (d && d.linked ? "var(--ok)" : n.color);
    var dot = el("circle", { r: 2.6, fill: color }, gPk);
    n.g.classList.add("busy");
    var out = dot.animate([{ transform: "translate(" + CX + "px," + CY + "px)" }, { transform: "translate(" + n.x + "px," + n.y + "px)" }], { duration: 520, easing: "ease-in" });
    out.onfinish = function () {
      ping(n.x, n.y, color, 28, 520);
      var back = dot.animate([{ transform: "translate(" + n.x + "px," + n.y + "px)" }, { transform: "translate(" + CX + "px," + CY + "px)" }], { duration: 520, easing: "ease-out", delay: 120 });
      back.onfinish = function () { dot.remove(); ping(CX, CY, "var(--core)", 46, 520); setTimeout(function () { n.g.classList.remove("busy"); }, 900); };
    };
  }
  function target(id) {
    if (view) return nodes[id] ? { n: nodes[id], d: nodes[id].d } : null;
    var d = data && (data.devices || []).filter(function (x) { return x.id === id; })[0];
    return d && pods[groupOf(d)] ? { n: pods[groupOf(d)], d: d } : null;
  }

  // The name under the bridgit mark: "This phone" unless the options name another device (o.core), as the
  // portal does when it looks at one phone, or a satellite when it looks at its hub (5 Nov 2026).
  var coreText = document.getElementById("coresub");
  function core(o) {
    var n = o && o.core ? String(o.core) : "This phone";
    if (n.length > 14) n = n.slice(0, 13) + "\u2026";
    coreText.textContent = n;
    svg.setAttribute("aria-label", "Devices map: " + (o && o.core ? o.core : "this phone") + " in the middle and its groups of devices around it.");
  }
  window.BridgitDevices = {
    setup: function (o) { core(o); if (mode === "idle" || mode === "playing") play(o); },
    apply: function (o) { core(o); if (mode !== "idle") queued = o; else draw(o); },
    scanStart: function (o) { core(o); scanStart(o); }, scanUpdate: scanUpdate, scanEnd: function (o) { core(o); scanEnd(o); },
    events: function (list) {
      (list || []).forEach(function (e, i) { setTimeout(function () { var t = target(e.target); if (t) packet(t.n, e.ok, t.d); }, i * 180); });
    },
    back: function () { if (!view) return false; closeGroup(true); return true; },
    open: function (id) { if (mode === "idle") openGroup(id, true); },
    nodeIds: function () { return Object.keys(nodes); },
    podIds: function () { return Object.keys(pods); },
    mode: function () { return mode; }
  };
  findBtn.addEventListener("click", function () { if (mode !== "scanning") A.open("find"); });
  tabs.forEach(function (t) { t.addEventListener("click", function () { pickTab(t.getAttribute("data-tab")); }); });
  svg.addEventListener("click", function (e) { if (mode === "walking" && !e.target.closest(".pod")) skipWalk = true; });
  A.ready();
})();
</script>
</body>
</html>
