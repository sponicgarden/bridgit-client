			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# The APK's bundled brand logos and catalog (app/src/main/assets/device-brands), next to diagnostics/\n# so the map page's ../device-brands/ paths resolve. Always re-synced; it is a handful of small files.\n# The List draws logos natively, and UIImage can't read SVG, so each SVG is also rendered to PNG\n# (brand-logos/<asset>.png) with macOS Quick Look. Without a render, the app shows the brand's name instead.\nset -e\nsrc=\"$SRCROOT/../../app/src/main/assets/device-brands\"\nres=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nmkdir -p \"$res/device-brands\" \"$res/brand-logos\"\nrsync -a --delete \"$src/\" \"$res/device-brands/\"\n# Each SVG is drawn on a mid-grey backdrop (#808080) first, so white logos survive Quick Look's white page;\n# the app turns that grey back into transparency (BrandImages.trim).\ncache=\"$DERIVED_FILE_DIR/brand-logos\"\nwork=\"$DERIVED_FILE_DIR/brand-logos-src\"\nmkdir -p \"$cache\" \"$work\"\nfor f in \"$src\"/*.svg; do\n  name=\"$(basename \"$f\")\"\n  out=\"$cache/$name.png\"\n  if [ ! -f \"$out\" ] || [ \"$f\" -nt \"$out\" ]; then\n    perl -0pe 's/(<svg\\b[^>]*>)/$1<rect x=\"-100000\" y=\"-100000\" width=\"200000\" height=\"200000\" fill=\"#808080\"\\/>/s' \"$f\" > \"$work/$name\"\n    qlmanage -t -s 256 -o \"$cache\" \"$work/$name\" >/dev/null 2>&1 || echo \"warning: no PNG render for $name\"\n  fi\ndone\nrsync -a --delete \"$cache/\" \"$res/brand-logos/\"\n";
		};
