# Bridgit's version line. The app's versionName is <major>.<minor>.<build> and its versionCode is <build>.
# tools/allocate-apk-version.py reads major and minor as the floor of every APK version it reserves (debug, test and
# release); the build number keeps counting from the shared counter. tools/release-status.sh reads them too.
#
# Bump minor when a release adds a big feature set (1.7 -> 1.8), and major for a break such as a new
# package, dropped Android versions or a rebuilt core. Do it in the release's own PR. The build number keeps
# counting up across bumps, so updates always install over older builds. A bump is one-way: once a build
# reserves the new line, every later build on every checkout stays on it.
# 1.7 (1 Nov 2026): cc.bridgit.app package, Android 10+, relay, agent control, demo page.
# 1.8 (2 Nov 2026): card stacks, scheduled actions, battery and power, weather, ADB control, bug-report follow-ups
#   and each agent's own team key, bug reports always allowed.
# 2.0 (12 Nov 2026): Client Core (contract pack, door fixtures, device profile, core.session and core.media),
#   approver devices and spending authority.
major=2
minor=0
# Added to the commit count. 60 since 5 Nov 2026 (the published 1.8.2857 was ahead of main's count). If history is ever squashed or the repo recreated
# (docs/release-checklist.md), set it to at least the last published versionCode so builds keep rising.
base=60
